# Build the Windows ARM GNU toolchain with GCC plugin support.

name: ARM Plugin Toolchain

on:
  push:
    branches:
    - build-arm-plugin-v1.0.1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BUG_URL: 'https://github.com/zephyrproject-rtos/sdk-ng/issues'
  BUNDLE_NAME: Zephyr SDK
  TARGET: arm-zephyr-eabi
  HOST: windows-x86_64
  HOST_TRIPLE: x86_64-w64-mingw32

jobs:
  build:
    name: Windows ARM GNU Toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
    - name: Check out source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Free runner disk space
      run: |
        df -h

        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/share/boost \
          "${AGENT_TOOLSDIRECTORY}"

        docker system prune -af || true
        df -h

    - name: Build and package toolchain
      run: |
        cat > "${RUNNER_TEMP}/build-arm-plugin-toolchain.sh" <<'SCRIPT'
        set -euo pipefail

        WORKSPACE="${RUNNER_TEMP}/workspace"
        CT_NG="${WORKSPACE}/crosstool-ng/bin/ct-ng"

        mkdir -p "${WORKSPACE}"
        chmod -R 777 "${GITHUB_WORKSPACE}"
        chmod -R 777 "${RUNNER_TEMP}"

        apt-get update
        apt-get install -y autoconf automake bison flex gettext \
                               help2man libboost-dev libboost-regex-dev \
                               libncurses5-dev libtool-bin libtool-doc \
                               pkg-config texinfo p7zip

        export PATH="/opt/mingw-w64-win32/bin:${PATH}"
        export TAR=tar

        git config --global --add safe.directory '*'
        git submodule init
        git submodule update --depth=1 --recursive crosskit/crosskit-mingw-w64-libpython
        git submodule update --depth=1 --recursive crosstool-ng
        git submodule update --depth=1 --recursive binutils
        git submodule update --depth=1 --recursive gdb
        git submodule update --depth=1 --recursive gcc
        git submodule update --depth=1 --recursive picolibc

        pushd "${WORKSPACE}"
        mkdir -p crosstool-ng-build
        cd crosstool-ng-build

        pushd "${GITHUB_WORKSPACE}/crosstool-ng"
        ./bootstrap
        popd

        "${GITHUB_WORKSPACE}/crosstool-ng/configure" --prefix="${WORKSPACE}/crosstool-ng"
        make -j"$(nproc)"
        make install

        popd
        rm -rf "${WORKSPACE}/crosstool-ng-build"
        "${CT_NG}" version

        VERSION="$(git describe --tags --match 'v*')"
        echo "${VERSION:1}" > "${RUNNER_TEMP}/version"

        export CT_PREFIX="${WORKSPACE}/output"

        mkdir -p "${WORKSPACE}/build"
        pushd "${WORKSPACE}/build"

        cat "${GITHUB_WORKSPACE}/configs/common.config" \
            "${GITHUB_WORKSPACE}/configs/${TARGET}.config" \
            > .config

        cat <<EOF >> .config
        CT_SHOW_CT_VERSION=n
        CT_TOOLCHAIN_PKGVERSION="${BUNDLE_NAME} $(<"${RUNNER_TEMP}/version")"
        CT_TOOLCHAIN_BUGURL="${BUG_URL}"
        CT_LOCAL_TARBALLS_DIR="${WORKSPACE}/sources"
        CT_OVERLAY_LOCATION="${GITHUB_WORKSPACE}/overlays"
        CT_LOG_PROGRESS_BAR=n
        CT_LOG_EXTRA=y
        CT_LOG_LEVEL_MAX="EXTRA"
        CT_CANADIAN=y
        CT_HOST="${HOST_TRIPLE}"
        CT_GDB_CROSS_PYTHON=y
        CT_GDB_CROSS_PYTHON_VARIANT=y
        CT_GDB_CROSS_PYTHON_BINARY="${GITHUB_WORKSPACE}/crosskit/crosskit-mingw-w64-libpython/python-3.12.10/bin/python"
        CT_EXPERIMENTAL=y
        CT_ALLOW_BUILD_AS_ROOT=y
        CT_ALLOW_BUILD_AS_ROOT_SURE=y
        EOF

        mkdir -p "${WORKSPACE}/sources"

        "${CT_NG}" savedefconfig DEFCONFIG=build.config
        "${CT_NG}" distclean
        "${CT_NG}" defconfig DEFCONFIG=build.config
        "${CT_NG}" build
        popd

        grep -E 'CT_BINUTILS_PLUGINS=y|CT_CC_GCC_ENABLE_PLUGINS=y' "${WORKSPACE}/build/.config"
        grep -E -- '--enable-plugin' "${WORKSPACE}/build/build.log"

        OUTPUT_BASE="${WORKSPACE}/output"
        OUTPUT_DIR="HOST-${HOST_TRIPLE}"

        chmod -R u+w "${OUTPUT_BASE}/${OUTPUT_DIR}"

        pushd "${OUTPUT_BASE}/${OUTPUT_DIR}/${TARGET}"
        rm -f build.log.bz2
        test -x "bin/${TARGET}-gcc.exe"
        popd

        mv "${OUTPUT_BASE}/${OUTPUT_DIR}" "${OUTPUT_BASE}/output"

        ARCHIVE_NAME="toolchain_gnu_${HOST}_${TARGET}"
        ARCHIVE_FILE="${ARCHIVE_NAME}.7z"

        pushd "${OUTPUT_BASE}/output"
        7z a -t7z -l "${GITHUB_WORKSPACE}/${ARCHIVE_FILE}" "${TARGET}"
        popd

        md5sum "${ARCHIVE_FILE}" > "${GITHUB_WORKSPACE}/md5.sum"
        sha256sum "${ARCHIVE_FILE}" > "${GITHUB_WORKSPACE}/sha256.sum"
        SCRIPT

        docker run --rm \
          -e GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
          -e RUNNER_TEMP="${RUNNER_TEMP}" \
          -e BUG_URL="${BUG_URL}" \
          -e BUNDLE_NAME="${BUNDLE_NAME}" \
          -e TARGET="${TARGET}" \
          -e HOST="${HOST}" \
          -e HOST_TRIPLE="${HOST_TRIPLE}" \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
          -w "${GITHUB_WORKSPACE}" \
          ghcr.io/zephyrproject-rtos/sdk-build:v1.5.2 \
          bash "${RUNNER_TEMP}/build-arm-plugin-toolchain.sh"

    - name: Upload toolchain build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: log_toolchain_gnu_windows-x86_64_arm-zephyr-eabi
        path: ${{ runner.temp }}/workspace/build/build.log

    - name: Upload toolchain artifact
      uses: actions/upload-artifact@v4
      with:
        name: toolchain_gnu_windows-x86_64_arm-zephyr-eabi
        path: |
          toolchain_gnu_windows-x86_64_arm-zephyr-eabi.7z
          md5.sum
          sha256.sum
